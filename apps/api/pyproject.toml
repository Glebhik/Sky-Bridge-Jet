[project]
name = "sky-bridge-jet-api"
version = "0.1.0"
description = "Sky Bridge Jet modular monolith API foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  # Argon2id password hashing. We never implement hashing/crypto ourselves; the
  # library owns hashing, verification (constant-time), and rehash decisions.
  "argon2-cffi==25.1.0",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.15.0",
  "pyjwt[crypto]==2.10.1",
  "sqlalchemy==2.0.51",
  # Official Stripe SDK. Used only by RealStripeGateway (test-mode keys); CI and
  # unit/integration tests never require it at runtime (the fake gateway is used).
  "stripe==15.5.0",
  "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a configured PostgreSQL database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sky_bridge_jet"]
