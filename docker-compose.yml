services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-sky_bridge_jet}
      POSTGRES_USER: ${DATABASE_USER:-sky_bridge_jet}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-sky_bridge_jet_dev_only}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-sky_bridge_jet} -d ${DATABASE_NAME:-sky_bridge_jet}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    command: /app/.venv/bin/uvicorn sky_bridge_jet.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    environment:
      APP_ENVIRONMENT: development
      DATABASE_NAME: ${DATABASE_NAME:-sky_bridge_jet}
      DATABASE_USER: ${DATABASE_USER:-sky_bridge_jet}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-sky_bridge_jet_dev_only}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./apps/api/src:/app/src

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: pnpm --dir apps/web dev --hostname 0.0.0.0
    environment:
      # Server-only upstream API origin for the same-origin proxy. Inside the Compose
      # network the API is the `api` service, not the web container's own localhost, so
      # this defaults to http://api:8000. A Compose-specific interpolation variable
      # (WEB_API_UPSTREAM_ORIGIN) is used deliberately so a developer's root `.env`
      # (which sets API_UPSTREAM_ORIGIN=http://localhost:8000 for host-run Next) cannot
      # leak localhost into the container and break the proxy. Never NEXT_PUBLIC_*.
      API_UPSTREAM_ORIGIN: ${WEB_API_UPSTREAM_ORIGIN:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./apps/web:/app/apps/web
      - web_node_modules:/app/apps/web/node_modules

volumes:
  postgres_data:
  web_node_modules:
